name: Daily Supertrend Scan (Buy / Sell Telegram)

on:
  schedule:
    # 10:00 AM Nepal Time (Asia/Kathmandu = UTC+5:45) => 04:15 UTC
    # NEPSE trades Sun–Thu; Fri/Sat skipped by cron. Mid-week holidays skipped in-script.
    - cron: '15 4 * * 0-4'
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass weekend / holiday / as_of dedupe gates?'
        required: true
        type: boolean
        default: false
      scan_all:
        description: 'Scan all ordinary NEPSE equities (not just portfolio)?'
        required: true
        type: boolean
        default: true

jobs:
  supertrend-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests httpx
          pip install git+https://github.com/basic-bgnr/NepseUnofficialApi.git@dev

      - name: Run Daily Supertrend Scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          FORCE="${{ github.event.inputs.force }}"
          SCAN_ALL="${{ github.event.inputs.scan_all }}"
          ARGS=""
          if [ -z "$SCAN_ALL" ] || [ "$SCAN_ALL" = "true" ]; then
            ARGS="--all"
          fi
          if [ "$FORCE" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python supertrend_scanner.py $ARGS

      - name: Commit position state
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add supertrend_positions.json supertrend_scan_latest.json || true
          if git diff --staged --quiet; then
            echo "No position/state change."
          else
            git commit -m "📈 Supertrend scan state $(date +'%Y-%m-%d')"
            git push
          fi
