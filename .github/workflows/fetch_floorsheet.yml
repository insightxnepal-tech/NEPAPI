name: Fetch Floorsheet Data

on:
  # No schedule: the 10:00 AM NPT slot this used to run on is before the 11:00
  # board open, so it could only ever fetch the previous session. The scheduled
  # fetch is handled by daily_floorsheet.yml, which runs after the 15:00 close.
  workflow_dispatch: # This allows you to run it manually from the Actions tab anytime!

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # This gives the action permission to commit back to your repo
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run script to fetch floorsheet
        run: |
          # Create a 'data' folder to keep things organized, and write straight
          # into it. A glob-move of floorsheet_*.csv would sweep up the 100+
          # session files already committed at the repo root.
          mkdir -p data
          python fetch_floorsheet_csv.py --out data/floorsheet_latest.csv
          
          # Name the file after the session the rows actually belong to: the API
          # serves the most recent completed session whatever date is asked for,
          # so the local calendar date can label it wrongly.
          BUSINESS_DATE=$(python -c "import csv; print(next(csv.DictReader(open('data/floorsheet_latest.csv')))['businessDate'])")
          mv data/floorsheet_latest.csv "data/floorsheet_${BUSINESS_DATE}.csv"
          
          # The script saves XLSX files to the home directory by default. 
          # We'll copy them to the data folder so they get committed too.
          cp ~/Downloads/floorsheet/*.xlsx data/ 2>/dev/null || true
          
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stage the files in the data directory
          git add data/
          
          # Commit and push if there are any new files/changes. If not, do nothing.
          git diff --staged --quiet || (git commit -m "Automated fetch of floorsheet data" && git push)
