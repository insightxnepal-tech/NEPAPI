name: Post-Market Strategy 5pm NPT

# 5:00 PM Nepal Time = 11:15 UTC (NPT is UTC+05:45).
# NEPSE trading week is Monday–Friday from 2026-04-06 (Sat+Sun closed).
# The Python job still no-ops when the floorsheet is missing (public holiday).

on:
  schedule:
    - cron: '15 11 * * 1-5'
  workflow_dispatch:

jobs:
  postmarket:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TZ: Asia/Kathmandu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests tqdm pywasm httpx
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Fetch floorsheet, rank strategy, send Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python postmarket_strategy.py .

      - name: Commit floorsheet and strategy report
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add floorsheet_20*.csv strategy_postmarket_*.md 2>/dev/null || true
          if git diff --quiet && git diff --staged --quiet; then
            echo "No floorsheet/strategy changes to commit."
          else
            git commit -m "Post-market strategy $(date +'%Y-%m-%d')"
            git push
          fi
