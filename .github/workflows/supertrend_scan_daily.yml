name: Daily Supertrend Scan (Telegram)

on:
  schedule:
    # 5:00 PM Nepal Time (Asia/Kathmandu = UTC+5:45) => 11:15 UTC
    - cron: '15 11 * * 0-4'
  workflow_dispatch:
    inputs:
      scan_all:
        description: 'Scan all ordinary NEPSE equities (not just portfolio)?'
        required: true
        type: boolean
        default: true

jobs:
  supertrend-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests
          pip install git+https://github.com/basic-bgnr/NepseUnofficialApi.git@dev

      - name: Run Supertrend Scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SCAN_ALL="${{ github.event.inputs.scan_all }}"
          if [ -z "$SCAN_ALL" ] || [ "$SCAN_ALL" = "true" ]; then
            python supertrend_scanner.py --all
          else
            python supertrend_scanner.py
          fi

      - name: Commit scan state
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add supertrend_scan_latest.json
          if git diff --staged --quiet; then
            echo "No Supertrend state change."
          else
            git commit -m "📈 Supertrend scan $(date +'%Y-%m-%d')"
            git push
          fi
